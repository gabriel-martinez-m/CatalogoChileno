<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>

    <!-- 1. Estilos locales de Bootstrap (CSS) -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- 2. Mis estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Contenido principal -->
     <main class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <!-- Tarjeta del Formulario -->
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Encabezado / Logo -->
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none text-dark d-inline-block mb-2">
                                <img src="images/LogoCatalogoChileno.svg" alt="Logotipo" height="24" class="d-inline-block me-2 text-center">
        </a>
                            </a>
                            <p class="text-muted small">Bienvenido de nuevo, ingresa a tu cuenta</p>
                        </div>

                        <!-- Selector de Rol (Artista vs Cliente) -->
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-muted d-block text-center mb-2">
                                ¿Cómo deseas ingresar?
                            </label>
                            <div class="btn-group w-100" role="group" aria-label="Tipo de usuario">
                                
                                <!-- Opción Artista -->
                                <input type="radio" class="btn-check" name="userType" id="typeArtista" autocomplete="off" checked>
                                <label class="btn btn-outline-primary py-2 fw-semibold" for="typeArtista">
                                    <i class="fa-solid fa-palette me-1"></i> Artista
                                </label>

                                <!-- Opción Cliente -->
                                <input type="radio" class="btn-check" name="userType" id="typeCliente" autocomplete="off">
                                <label class="btn btn-outline-primary py-2 fw-semibold" for="typeCliente">
                                    <i class="fa-solid fa-user me-1"></i> Cliente
                                </label>
                                
                            </div>
                        </div>

                        <!-- Formulario de Login -->
                        <form action="#" method="POST" novalidate>
                            
                            <!-- Campo Correo Electrónico -->
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="loginEmail" placeholder="nombre@ejemplo.com" required>
                                <label for="loginEmail">
                                    <i class="fa-regular fa-envelope me-1 text-secondary"></i> Correo electrónico
                                </label>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
                                <label for="loginPassword">
                                    <i class="fa-solid fa-lock me-1 text-secondary"></i> Contraseña
                                </label>
                            </div>

                            <!-- Opciones: Recordarme y Olvidé contraseña -->
                            <div class="d-flex justify-content-between align-items-center mb-4 small">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-input-label text-muted" for="rememberMe">
                                        Recordarme
                                    </label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none fw-semibold">
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>

                            <!-- Botón Iniciar Sesión -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm fs-6 mb-3">
                                Iniciar Sesión
                            </button>

                        </form>

                        <!-- Pie de tarjeta: Registro -->
                        <div class="text-center pt-3 border-top">
                            <span class="text-muted small">¿Aún no tienes una cuenta?</span>
                            <a href="#" class="text-primary fw-bold small text-decoration-none ms-1">
                                Regístrate
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

    <!-- Pie de página (Footer) -->
    <footer class="bg-light text-center text-muted py-3 border-top mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Mi Proyecto Web. Desarrollado en clase Fullstack.</p>
        </div>
    </footer>

    <!-- 2. Scripts locales de Bootstrap (JS) -->
    <!-- Nota: Usamos 'bootstrap.bundle.min.js' porque incluye Popper.js (necesario para desplegables y modales) -->
    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>

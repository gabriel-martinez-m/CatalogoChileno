<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - CatálogoChileno</title>

    <!-- Estilos locales de Bootstrap (CSS) -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Mis estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Contenido principal -->
    <main class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    
                    <!-- Tarjeta del Formulario de Admin -->
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        
                        <div class="card-body p-4 p-sm-5">
                                                    
                            <!-- Encabezado / Logo -->
                            <div class="text-center mb-4">
                                <a href="index.html" class="text-decoration-none text-dark d-inline-block mb-3">
                                    <img src="images/LogoCatalogoChileno.svg" alt="Logotipo" height="24" class="d-inline-block me-2 text-center">
                                </a>
                            
                                <h5 class="fw-bold mb-1">Portal Administrativo</h5>
                                <p class="text-muted small">Ingresa tus credenciales de sistema</p>
                            </div>
                            
                            <!-- Formulario de Login -->
                            <form action="admin.html" method="GET" novalidate>
                                
                                <!-- Campo Correo Electrónico / Usuario -->
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="adminEmail" placeholder="admin@catalogochileno.cl" required>
                                    <label for="adminEmail">
                                        <i class="fa-regular fa-envelope me-1 text-secondary"></i> Correo de administrador
                                    </label>
                                </div>

                                <!-- Campo Contraseña -->
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control" id="adminPassword" placeholder="Contraseña" required>
                                    <label for="adminPassword">
                                        <i class="fa-solid fa-lock me-1 text-secondary"></i> Contraseña
                                    </label>
                                </div>

                                <!-- Botón Iniciar Sesión -->
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm fs-6 mb-3">
                                    Ingresar al Sistema
                                </button>

                            </form>

                            <!-- Pie de tarjeta: Volver al sitio público -->
                            <div class="text-center pt-3 border-top mt-4">
                                <a href="index.html" class="text-muted small text-decoration-none hover-primary">
                                    <i class="fa-solid fa-arrow-left me-1"></i> Volver al catálogo público
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>
<!-- Pie de página (Footer) -->
    <footer class="bg-light text-center text-muted py-3 border-top mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 CatálogoChileno. Todos los derechos reservados.</p>
        </div>
    </footer>
    <!-- Scripts locales de Bootstrap (JS) -->
    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>

# Puerto del Microservicio de Autenticación
server.port=8080
spring.application.name=servicio-autenticacion

# Base de Datos H2 (memoria)
spring.datasource.url=jdbc:h2:mem:bd_autenticacion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Firma y Tiempos de Expiración JWT
jwt.secret=ClaveSecretaParaFirmarLosTokensJWTDeCatalogoChileno2026!
jwt.expiration.access-token-ms=3600000
jwt.expiration.refresh-token-ms=86400000

# URL del Microservicio de Usuarios para Feign Client
app.usuario-service.url=http://localhost:8090
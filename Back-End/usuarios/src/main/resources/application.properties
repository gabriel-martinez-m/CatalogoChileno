# Configuración del Puerto del Microservicio
server.port=8090
spring.application.name=servicio-usuario

# Configuración de Base de Datos (H2 para Pruebas / MySQL para Producción)
spring.datasource.url=jdbc:h2:mem:bd_usuarios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Para visualizar tablas desde el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true